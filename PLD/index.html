<script>
(() => {
  const stage = document.getElementById('pld-stage');
  const templates = Array.from(document.querySelectorAll('template[data-pld-step]'));
  const choiceSteps = new Set([8, 12, 13, 19, 20]);
  const savedChoices = new Map();
  let current = 1;

  function show(step, updateHistory = false) {
    if (updateHistory) history.pushState({ pldStep: step }, '');
    current = step;
    stage.replaceChildren(templates[step - 1].content.cloneNode(true));
    const checked = savedChoices.get(step) || new Set();
    for (const button of stage.querySelectorAll('[data-pld="option"]')) {
      const selected = checked.has(button.id);
      button.setAttribute('aria-pressed', String(selected));
      button.closest('[data-animate-item]').classList.toggle('active', selected);
    }
    for (const carousel of stage.querySelectorAll('.swiper')) wireCarousel(carousel);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function wireCarousel(carousel) {
    const wrapper = carousel.querySelector('.swiper-wrapper');
    const slides = Array.from(wrapper.querySelectorAll('.swiper-slide'));
    const bullets = Array.from(carousel.querySelectorAll('.swiper-pagination-bullet'));
    const initialOffset = Number(wrapper.style.transform.match(/translate3d\((-?[\d.]+)px/)?.[1] || 0);
    let selected = 0;
    let startX = 0;
    function select(index) {
      selected = Math.max(0, Math.min(index, slides.length - 1));
      wrapper.style.transitionDuration = '260ms';
      wrapper.style.transform = `translate3d(${initialOffset - slides[selected].offsetLeft}px, 0px, 0px)`;
      slides.forEach((slide, position) => slide.classList.toggle('swiper-slide-active', position === selected));
      bullets.forEach((bullet, position) => bullet.classList.toggle('swiper-pagination-bullet-active', position === selected));
    }
    bullets.forEach((bullet, index) => {
      bullet.tabIndex = 0;
      bullet.setAttribute('role', 'button');
      bullet.setAttribute('aria-label', `Ir a la diapositiva ${index + 1}`);
      bullet.addEventListener('click', () => select(index));
      bullet.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          select(index);
        }
      });
    });
    carousel.style.touchAction = 'pan-y';
    carousel.addEventListener('dragstart', (event) => event.preventDefault());
    carousel.addEventListener('pointerdown', (event) => { startX = event.clientX; });
    carousel.addEventListener('pointerup', (event) => {
      const delta = event.clientX - startX;
      if (Math.abs(delta) > 35) select(selected + (delta < 0 ? 1 : -1));
    });
  }

  stage.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    const action = button.dataset.pld;
    if (action === 'back') {
      if (current > 1) history.back();
      return;
    }
    if (action === 'checkout') {
      window.location.assign(button.dataset.href);
      return;
    }
    if (action === 'option') {
      const choices = savedChoices.get(current) || new Set();
      const selected = !choices.has(button.id);
      if (selected) choices.add(button.id);
      else choices.delete(button.id);
      savedChoices.set(current, choices);
      button.setAttribute('aria-pressed', String(selected));
      button.closest('[data-animate-item]').classList.toggle('active', selected);
      return;
    }
    if (action === 'next' && current < templates.length) {
      if (choiceSteps.has(current) && !savedChoices.get(current)?.size) {
        stage.querySelector('[data-pld="option"]')?.focus();
        return;
      }
      show(current + 1, true);
      stage.querySelector('[id^="step_"]')?.focus({ preventScroll: true });
    }
  });
  history.replaceState({ pldStep: 1 }, '');
  window.addEventListener('popstate', (event) => show(event.state?.pldStep || 1));
  show(1);
})();

</script>
</body>
</html>
