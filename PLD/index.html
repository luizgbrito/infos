          <p class="fine">Precio en reales brasileños. Confirma el total y los métodos de pago disponibles en Payt.</p>
          <a class="action" href="${checkout}" target="_blank" rel="noopener noreferrer">Ir al checkout de Payt <span aria-hidden="true">↗</span></a>
        </section>
      </div>
      ${audio(3, "Entrega y acompañamiento")}
      ${video("ana", "3kvlzN7mt1E", "Testimonio de Ana")}
      <details><summary>Leer los testimonios del material original</summary>
        <blockquote>Tenía artrosis y una lesión de ligamento en la rodilla. Ya había gastado cientos de reales en suplementos y pomadas y, según mi experiencia, noté un cambio después del protocolo.</blockquote>
        <p class="fine">Paulo Nascimento, São Paulo, Brasil.</p>
        <blockquote>Tenía fibromialgia, osteofitos y dolores muy fuertes en los hombros, las manos y las piernas. Después de completar el protocolo, una mañana desperté sin dolor.</blockquote>
        <p class="fine">Teresa Ferreira, Belo Horizonte, Brasil.</p>
        <blockquote>Había recibido inyecciones y tenía programada una cirugía de columna. Decidí probar una opción más. Al principio no lo creía, pero cuento que mis dolores desaparecieron de una semana a otra.</blockquote>
        <p class="fine">Antônio Costa, Parnaíba, Brasil.</p>
      </details>
      <section class="offer-card">
        <h3>Guía esencial de movilidad</h3>
        <img class="book" src="assets/images/guia-movilidad.webp" alt="Portada ilustrativa de la Guía esencial de movilidad" width="1200" height="900" loading="lazy">
        <p>La oferta original presenta una guía adicional sobre hábitos cotidianos, movilidad, tensión muscular y formas de cuidar tus articulaciones.</p>
        <details><summary>Acceso, materiales y condiciones</summary><p>El material se presenta como digital y de pago único. Consulta al vendedor por el idioma de los entregables y las condiciones de acceso, acompañamiento y reembolso.</p></details>
      </section>
      <div class="controls">
        ${action("Volver al resumen", "back", true)}
        ${action("Reiniciar cuestionario", "reset", true)}
      </div>`;
    }

    function renderChoices(step) {
      const selected = answers.get(current) || [];
      const options = step.choices.map((choice, index) => {
        const checked = selected.includes(choice);
        if (step.multiple) {
          return `<label class="choice"><input type="checkbox" name="answer" value="${index}"${checked ? " checked" : ""}><span>${choice}</span></label>`;
        }
        return `<button type="button" class="choice" data-choice="${index}" aria-pressed="${checked}">${choice}</button>`;
      }).join("");
      return `<fieldset class="options"><legend class="sr-only">${step.title}</legend>${options}</fieldset>`;
    }

    function render(moveFocus = true) {
      progress.hidden = current === 0;
      if (current > 0) {
        document.querySelector("#progress-area").textContent = current === last ? "Oferta" : current === last - 1 ? "Resumen" : "Cuestionario";
        document.querySelector("#progress-count").textContent = `Etapa ${current} de ${last}`;
        document.querySelector("#progress-bar").setAttribute("aria-valuenow", current);
        document.querySelector("#progress-bar span").style.transform = `scaleX(${current / last})`;
      }

      if (current === 0) {
        screen.replaceChildren(home.content.cloneNode(true));
      } else {
        const step = screens[current];
        const content = typeof step.content === "function" ? step.content() : step.content || "";
        screen.innerHTML = `<section class="panel${step.offer ? " offer" : ""}" aria-labelledby="title">
          <h2 id="title" tabindex="-1">${step.title}</h2>
          ${step.description ? `<p class="description">${step.description}</p>` : ""}
          ${step.offer ? renderOffer() : `
            ${content}
            ${step.choices ? renderChoices(step) : ""}
            <p id="error" class="error" role="alert" hidden>Selecciona al menos una opción para continuar.</p>
            <div class="controls">
              ${action("← Volver", "back", true)}
              ${!step.choices || step.multiple ? action(step.button || "Continuar", "next") : ""}
            </div>`}
        </section>`;
      }
      screen.firstElementChild.classList.add("enter");
      if (moveFocus) {
        document.querySelector("#title").focus({ preventScroll: true });
        window.scrollTo(0, 0);
      }
    }

    function goTo(index) {
      current = Math.max(0, Math.min(index, last));
      render();
    }

    screen.addEventListener("change", event => {
      if (!event.target.matches('input[name="answer"]')) return;
      const step = screens[current];
      const toggled = step.choices[Number(event.target.value)];
      const inputs = Array.from(screen.querySelectorAll('input[name="answer"]'));
      if (event.target.checked && step.exclusive) {
        for (const input of inputs) {
          const choice = step.choices[Number(input.value)];
          if (input !== event.target && (toggled === step.exclusive || choice === step.exclusive)) input.checked = false;
        }
      }
      answers.set(current, inputs.filter(input => input.checked).map(input => step.choices[Number(input.value)]));
      document.querySelector("#error").hidden = true;
      inputs[0].closest("fieldset").removeAttribute("aria-describedby");
    });

    screen.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.choice !== undefined) {
        answers.set(current, [screens[current].choices[Number(button.dataset.choice)]]);
        goTo(current + 1);
        return;
      }
      const name = button.dataset.action;
      if (name === "next") {
        if (screens[current]?.multiple && !answers.get(current)?.length) {
          document.querySelector("#error").hidden = false;
          screen.querySelector("fieldset").setAttribute("aria-describedby", "error");
          screen.querySelector("input").focus();
          return;
        }
        goTo(current + 1);
      } else if (name === "back") {
        goTo(current - 1);
      } else if (name === "reset") {
        answers.clear();
        goTo(0);
      }
    });

    render(false);
  </script>
</body>
</html>
