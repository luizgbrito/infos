<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d484"/><stop offset="1" stop-color="#b07d1f"/>
    </linearGradient>
    <radialGradient id="goldc" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#f6d98a"/><stop offset="50%" stop-color="#e0ad44"/><stop offset="100%" stop-color="#b07d1f"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#f4eede"/>
  <rect width="1200" height="8" fill="#e2812b"/>

  <!-- Columna izquierda: espacio para la foto de la especialista (reemplazar) -->
  <rect x="40" y="40" width="300" height="340" rx="14" fill="#e7dfca"/>
  <text x="190" y="205" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" fill="#9a8f73">Foto de la</text>
  <text x="190" y="230" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" fill="#9a8f73">especialista</text>

  <!-- Centro: copy -->
  <text x="380" y="150" font-family="Poppins, sans-serif" font-size="46" font-weight="800" fill="#1f5c44">Tu Secreto</text>
  <text x="380" y="200" font-family="Poppins, sans-serif" font-size="46" font-weight="800" fill="#1f5c44">de la Insulina <tspan fill="#e2812b">está listo</tspan></text>
  <text x="382" y="238" font-family="Poppins, sans-serif" font-size="24" fill="#6f7a6c" font-weight="500">Solo falta confirmar tus datos</text>
  <rect x="382" y="262" width="430" height="60" rx="30" fill="#1f6b4a"/>
  <text x="597" y="300" text-anchor="middle" font-family="Poppins, sans-serif" font-size="22" font-weight="700" fill="#fff">Recibí el acceso al instante en tu email</text>

  <!-- Derecha: mockup del app -->
  <rect x="980" y="36" width="170" height="328" rx="30" fill="#143d2c"/>
  <rect x="992" y="48" width="146" height="304" rx="22" fill="#163f2e"/>
  <circle cx="1065" cy="150" r="46" fill="url(#goldc)"/>
  <path d="M1065 126 C 1086 136, 1086 164, 1065 174 C 1044 164, 1044 136, 1065 126 Z" fill="#143d2c"/>
  <text x="1065" y="238" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" letter-spacing="2" fill="#e9dcc0" font-weight="600">EL SECRETO DE LA</text>
  <text x="1065" y="262" text-anchor="middle" font-family="Poppins, sans-serif" font-size="22" fill="#e0ad44" font-weight="800">INSULINA</text>
  <text x="1065" y="292" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" fill="#cdbf9f">Tu plan de 21 días</text>

  <!-- Badge dorado arriba derecha -->
  <g transform="translate(1086,54)">
    <ellipse cx="0" cy="0" rx="52" ry="34" fill="url(#gold2)"/>
    <ellipse cx="0" cy="0" rx="44" ry="27" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" fill="#143d2c" font-weight="800">SECRETO DE LA</text>
    <text x="0" y="14" text-anchor="middle" font-family="Poppins, sans-serif" font-size="14" fill="#143d2c" font-weight="800">INSULINA</text>
  </g>
</svg>
