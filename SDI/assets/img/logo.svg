<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="gold" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset="45%" stop-color="#e0ad44"/>
      <stop offset="100%" stop-color="#b07d1f"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d484"/>
      <stop offset="1" stop-color="#a9741a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#143d2c"/>
  <!-- Emblema -->
  <circle cx="300" cy="212" r="132" fill="url(#goldRing)"/>
  <circle cx="300" cy="212" r="116" fill="#143d2c"/>
  <circle cx="300" cy="212" r="104" fill="url(#gold)"/>
  <!-- Marca: ojo / semilla (gota de insulina) -->
  <path d="M300 150 C 356 180, 356 244, 300 274 C 244 244, 244 180, 300 150 Z" fill="#143d2c"/>
  <circle cx="300" cy="212" r="26" fill="url(#gold)"/>
  <!-- Wordmark -->
  <text x="300" y="400" text-anchor="middle" font-family="Poppins, sans-serif" font-size="30" letter-spacing="8" fill="#e9dcc0" font-weight="600">EL SECRETO DE LA</text>
  <text x="300" y="470" text-anchor="middle" font-family="Poppins, sans-serif" font-size="78" fill="#e0ad44" font-weight="800" letter-spacing="2">INSULINA</text>
  <text x="300" y="520" text-anchor="middle" font-family="Poppins, sans-serif" font-size="26" letter-spacing="3" fill="#cdbf9f" font-weight="500">Tu plan de 21 días</text>
</svg>
