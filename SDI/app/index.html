<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Secreto de la Insulina · App</title>
<meta name="theme-color" content="#143d2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<section id="login" class="auth">
  <div class="auth-card">
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 120 120" width="92" height="92">
        <defs><radialGradient id="g" cx="40%" cy="35%" r="75%">
          <stop offset="0" stop-color="#f6d98a"/><stop offset="50%" stop-color="#e0ad44"/><stop offset="100%" stop-color="#b07d1f"/>
        </radialGradient></defs>
        <circle cx="60" cy="60" r="56" fill="#b07d1f"/><circle cx="60" cy="60" r="49" fill="#143d2c"/>
        <circle cx="60" cy="60" r="43" fill="url(#g)"/>
        <path d="M60 34 C82 44 82 76 60 86 C38 76 38 44 60 34 Z" fill="#143d2c"/>
        <circle cx="60" cy="60" r="11" fill="url(#g)"/>
      </svg>
    </div>
    <h1 class="brand">EL SECRETO DE LA<br><b>INSULINA</b></h1>
    <p class="brand-sub">Tu plan de 21 días</p>

    <form id="loginForm" autocomplete="on">
      <label>Email
        <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email">
      </label>
      <label>Contraseña
        <input type="password" id="password" required placeholder="Tu contraseña" autocomplete="current-password">
      </label>
      <p id="loginError" class="err hidden">Email o contraseña incorrectos.</p>
      <button type="submit" class="btn" id="loginBtn">Entrar</button>
    </form>
    <p class="hint">Recibiste tus datos de acceso por email después de la compra.<br>¿Problemas? <a data-wa href="#">Escríbenos por WhatsApp</a></p>
    <p class="demo-note">Demo: cualquier email · contraseña <b>secreto21</b></p>
  </div>
</section>

<!-- ======================= APP ======================= -->
<section id="app" class="app hidden">
  <header class="app-top">
    <div class="app-top__brand">
      <svg viewBox="0 0 120 120" width="30" height="30" aria-hidden="true">
        <defs><radialGradient id="g2" cx="40%" cy="35%" r="75%">
          <stop offset="0" stop-color="#f6d98a"/><stop offset="50%" stop-color="#e0ad44"/><stop offset="100%" stop-color="#b07d1f"/>
        </radialGradient></defs>
        <circle cx="60" cy="60" r="56" fill="url(#g2)"/>
        <path d="M60 34 C82 44 82 76 60 86 C38 76 38 44 60 34 Z" fill="#143d2c"/>
        <circle cx="60" cy="60" r="11" fill="url(#g2)"/>
      </svg>
      <span>El Secreto de la Insulina</span>
    </div>
    <button id="logout" class="logout" title="Salir">Salir</button>
  </header>

  <main id="views"></main>

  <nav class="tabbar" id="tabbar"></nav>
</section>

<script src="../assets/js/config.js"></script>
<script src="app-data.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
